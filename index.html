<style>
  :root{
    --bg: #f6f1e6;
    --bg-soft: #ece0c6;
    --ink: #2b2118;
    --ink-soft: #6b5440;
    --accent: #b87f4d;
    --rule: rgba(43,33,24,.15);
    --paper: #fffaef;
    --paper-warm: #f9eed7;
    --shadow-sm: 0 2px 0 rgba(43,33,24,.06), 0 6px 18px -8px rgba(43,33,24,.18);
    --shadow-md: 0 3px 0 rgba(43,33,24,.06), 0 18px 40px -16px rgba(43,33,24,.25);
    --radius-sm: 14px;
    --radius-md: 22px;
    --radius-lg: 32px;
    --serif: "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", ui-serif, Georgia, serif;
    --sans: "Pretendard", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{font-size:16px;line-height:1.6}
  /* Warm paper texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(184,127,77,.06), transparent 70%),
      radial-gradient(ellipse 60% 40% at 90% 60%, rgba(184,127,77,.04), transparent 70%);
  }
  #root{position:relative;z-index:1}
  img{max-width:100%;display:block}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  ::selection{background:var(--accent);color:var(--paper)}

  /* Placeholder image — rounded, warm */
  .ph{
    position:relative;background:
      repeating-linear-gradient(135deg, var(--paper-warm) 0 14px, transparent 14px 28px),
      var(--paper);
    color:var(--ink-soft);
    display:flex;align-items:flex-end;justify-content:flex-start;
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .ph .lbl{
    position:absolute;left:12px;bottom:12px;padding:4px 10px;
    background:var(--paper);border:1px solid var(--rule);
    border-radius:999px;text-transform:uppercase;font-size:10px;
  }
  .ph .cnr{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10px;color:var(--ink-soft);opacity:.5}

  /* Soft card baseline */
  .softcard{
    background:var(--paper);border:1px solid var(--rule);
    border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    padding:24px;
  }

  /* Stamp / sticker rotation helpers */
  .tilt-l{transform:rotate(-1.2deg)}
  .tilt-r{transform:rotate(1.2deg)}

  /* Cute heading style */
  .hand{font-family:var(--serif);font-weight:700;letter-spacing:-.005em}

  /* Decorative dot row */
  .dotline{display:inline-flex;gap:6px;align-items:center;color:var(--accent)}
  .dotline::before,.dotline::after{content:"♡";font-size:11px;opacity:.7}

  /* ── Mobile (≤767px) ───────────────────────────────────────────────────── */
  @media (max-width: 767px) {
    .mob-hide           { display: none !important; }
    .mob-sec            { padding: 72px 20px 48px !important; }
    .mob-sched-sec      { padding: 24px 20px !important; }
    .mob-sched-inner    { padding: 32px 24px !important; }
    .mob-nav            { padding: 0 12px !important; }
    .mob-nav-pill       { padding: 6px 16px !important; }
    .mob-nav-items      { gap: 14px !important; }
    .mob-hero           { padding: 70px 20px 12px !important; }
    .mob-col1           { grid-template-columns: 1fr !important; gap: 32px !important; }
    .mob-h2             { font-size: 36px !important; }
    .mob-sec-hdr        { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
    .mob-countdown      { grid-template-columns: 1fr !important; gap: 28px !important; }
    .mob-countdown-nums { gap: 12px !important; }
    .mob-countdown-digit{ font-size: 52px !important; }
    .mob-sched-hdr      { display: none !important; }
    .mob-sched-row      { grid-template-columns: 70px 1fr auto !important; gap: 10px !important; }
    .mob-works-row      { grid-template-columns: 56px 1fr !important; gap: 12px !important; }
    .mob-about-img      { order: -1; }
    .mob-gallery-grid   { grid-template-columns: 1fr !important; }
    .mob-concerts-grid  { grid-template-columns: 1fr !important; }
    .mob-concert-row    { grid-template-columns: 72px 1fr !important; gap: 10px !important; }
  }
</style>
